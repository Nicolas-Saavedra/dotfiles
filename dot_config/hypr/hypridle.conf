general {
    lock_cmd = pkill -f "class=my[.]screensaver"; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on; systemctl --user restart swayosd.service
    ignore_dbus_inhibit = false
}

# Docked (external monitor on): only the screensaver fires. Lock, DPMS-off and
# suspend are skipped via scripts/docked.sh. Undocked: everything below runs.
# (scripts/external-monitor-inhibit.sh only blocks *sleep* while docked, so the
# idle timers themselves keep running.)

# Screensaver after 5 minutes
listener {
    timeout = 300
    ignore_inhibit = false
    on-timeout = pidof hyprlock || ~/.local/bin/screensaver-launch
}

# Lock after 15 minutes total. Spawning the screensaver window resets the idle
# timer, so this is measured from then: 300 + 602 ≈ 900s.
listener {
    timeout = 602
    ignore_inhibit = false
    on-timeout = ~/.config/hypr/scripts/docked.sh || loginctl lock-session
}

listener {
    timeout = 720
    ignore_inhibit = false
    on-timeout = ~/.config/hypr/scripts/docked.sh || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    ignore_inhibit = false
    on-timeout = ~/.config/hypr/scripts/docked.sh || systemctl suspend
}
