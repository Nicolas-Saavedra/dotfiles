# Single logical display: all workspaces live on eDP-1. When an external is
# docked, the hotplug handler (scripts/external-monitor-primary.sh) disables
# eDP-1, and Hyprland automatically relocates these workspaces onto the
# external; they move back when it is unplugged. (If you go back to a
# side-by-side two-monitor layout, re-split these across an $extMon rule.)

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

# Drop-down console (Super+grave). Flush to the top and sides, no border; the bottom gap
# is a placeholder that scripts/scratchpad-toggle.sh recomputes per monitor on each toggle.
# on-created-empty seeds herdr the first time the console opens (and again after its last
# window closes). The [workspace ...] prefix pins the spawn to the console explicitly.
workspace = special:scratchpad, gapsin:0, gapsout:0 0 696 0, border:false, on-created-empty:[workspace special:scratchpad silent] ghostty --class=scratchpad.herdr -e herdr --session scratch
