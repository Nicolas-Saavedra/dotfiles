# waybar now runs as a systemd user service (waybar.service, enabled under
# graphical-session.target) so it auto-restarts on crash. This listener restarts
# it on monitor hotplug, which waybar otherwise handles badly.
exec-once = ~/.config/hypr/scripts/waybar-monitor-reload.sh
exec-once = swaync
exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper-rotate.sh
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/external-monitor-inhibit.sh
exec-once = ~/.config/hypr/scripts/external-monitor-primary.sh

# Setup fcitx5 (env vars are declared in environment.conf)
exec-once = fcitx5

# Setup screen sharing
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Setup clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


exec-once = walker --gapplication-service
exec-once = swayosd-server

# Reload preview
exec = ~/.config/hypr/scripts/reload.sh
