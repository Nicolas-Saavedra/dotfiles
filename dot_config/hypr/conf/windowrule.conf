# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Disable blur for floating XWayland window
windowrule = noblur, xwayland:1, floating:1

# Rules to handle calendar notifications for betterbird, see https://github.com/hyprwm/Hyprland/issues/4356
windowrulev2 = opacity 0.80 0.70,class:^(betterbird)$,initialTitle:^(Calendar Reminders)$
windowrulev2 = float,class:^(betterbird)$,initialTitle:^(Calendar Reminders)$
windowrulev2 = size 700 400,class:^(betterbird)$,initialTitle:^(Calendar Reminders)$
