$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod Shift Control, Escape, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, ~/.config/hypr/scripts/wallpaper-menu.sh # Wallpaper rotation menu
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/wallpaper-set.sh # Set a specific wallpaper now
bind = $mainMod, F, togglefloating,
bind = $mainMod, W, exec, walker
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod Shift, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots # Screenshot
bind = $mainMod Shift, A, exec, ~/.config/hypr/scripts/annotate.sh # Screenshot region + annotate (satty)
bind = $mainMod Control, S, exec, ~/.config/hypr/scripts/ocr.sh # OCR region → clipboard
bind = $mainMod Shift, R, exec, ~/.config/hypr/scripts/record-toggle.sh # Toggle quick screen recording
bind = $mainMod, K, exec, ~/.config/hypr/scripts/keybind-cheatsheet.sh # Keybind cheatsheet
bind = $mainMod, PERIOD, exec, walker -m symbols # Select emoji
bind = $mainMod, V, exec, walker -m clipboard # Open clipboard history

# Emergency escape hatch: force the internal laptop panel back on. Blind-typeable
# if the external-monitor handler ever leaves you with a black screen while docked.
# Uses force-internal.sh (escalating recovery) because a plain `keyword monitor`
# silently fails to re-enable eDP-1 from a zero-monitor state on aquamarine.
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/force-internal.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod shift, f, fullscreen, 0

# Hot-swap to lua config (testing). Reverse bind is in lua-migration/conf/keybinding.lua.
bind = $mainMod SHIFT CONTROL, H, exec, ~/.config/hypr/scripts/hyprconfig-switch.sh toggle && hyprctl reload

# Laptop multimedia keys for volume and LCD brightness, with swayosd overlay.
# Brightness goes through brightness.sh: backlight on eDP-1, DDC/CI on externals.
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
