$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal # Open a terminal
bind = $mainMod SHIFT, Return, exec, ghostty -e herdr # Open a terminal running herdr
bind = $mainMod, Q, killactive, # Close the focused window
bind = $mainMod Shift, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Force-kill the focused window
bind = $mainMod Shift Control, Escape, exit, # Exit Hyprland and log out
bind = $mainMod, E, exec, $fileManager # Open the file manager
bind = $mainMod, B, exec, ~/.config/hypr/scripts/wallpaper-menu.sh # Wallpaper rotation menu
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/wallpaper-set.sh # Set a specific wallpaper now
bind = $mainMod, F, togglefloating, # Toggle floating for the focused window
bind = $mainMod, W, exec, walker # Open the app launcher
bind = $mainMod, L, exec, hyprlock # Lock the screen
bind = $mainMod SHIFT, L, exec, ~/.local/bin/screensaver-launch # Start the screensaver
bind = $mainMod, P, pseudo, # Toggle pseudo-tiling (dwindle layout)
bind = $mainMod, J, layoutmsg, togglesplit # Toggle split direction (dwindle layout)
bind = $mainMod Shift, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots # Screenshot a region to a file
bind = $mainMod Shift, A, exec, ~/.config/hypr/scripts/annotate.sh # Screenshot a region and annotate it
bind = $mainMod Control, S, exec, ~/.config/hypr/scripts/ocr.sh # Copy text from a screen region (OCR)
bind = $mainMod Shift, R, exec, ~/.config/hypr/scripts/record-toggle.sh # Start or stop a screen recording
bind = $mainMod, K, exec, ~/.config/hypr/scripts/keybind-cheatsheet.sh # Show this keybind cheatsheet
bind = $mainMod, PERIOD, exec, walker -m symbols # Pick an emoji or symbol
bind = $mainMod, V, exec, walker -m clipboard # Browse clipboard history

# Drop-down console (Omarchy-style Quake scratchpad): special:scratchpad sized to the top
# half of the focused monitor by scratchpad-toggle.sh, seeded with herdr on first open.
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/scratchpad-toggle.sh # Toggle the drop-down herdr console
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratchpad # Move the focused window to the drop-down console

# Emergency escape hatch: force the internal laptop panel back on. Blind-typeable
# if the external-monitor handler ever leaves you with a black screen while docked.
# Uses force-internal.sh (escalating recovery) because a plain `keyword monitor`
# silently fails to re-enable eDP-1 from a zero-monitor state on aquamarine.
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/force-internal.sh # Force the internal laptop display back on

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # Move focus to the window on the left
bind = $mainMod, right, movefocus, r # Move focus to the window on the right
bind = $mainMod, up, movefocus, u # Move focus to the window above
bind = $mainMod, down, movefocus, d # Move focus to the window below

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move the focused window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move the focused window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move the focused window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move the focused window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move the focused window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move the focused window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move the focused window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move the focused window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move the focused window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move the focused window to workspace 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Switch to the next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Switch to the previous workspace

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Drag to move a window
bindm = $mainMod, mouse:273, resizewindow # Drag to resize a window

bind = $mainMod shift, f, fullscreen, 0 # Toggle fullscreen for the focused window

# Hot-swap to lua config (testing). Reverse bind is in lua-migration/conf/keybinding.lua.
bind = $mainMod SHIFT CONTROL, H, exec, ~/.config/hypr/scripts/hyprconfig-switch.sh toggle && hyprctl reload # Hot-swap between the hyprlang and Lua configs

# Laptop multimedia keys for volume and LCD brightness, with swayosd overlay.
# Brightness goes through brightness.sh: backlight on eDP-1, DDC/CI on externals.
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise # Raise the output volume
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower # Lower the output volume
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle # Mute or unmute the output
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle # Mute or unmute the microphone
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up # Increase screen brightness
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down # Decrease screen brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # Skip to the next track
bindl = , XF86AudioPause, exec, playerctl play-pause # Play or pause media
bindl = , XF86AudioPlay, exec, playerctl play-pause # Play or pause media
bindl = , XF86AudioPrev, exec, playerctl previous # Skip to the previous track
