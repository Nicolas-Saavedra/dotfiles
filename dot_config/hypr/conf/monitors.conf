# External-only when docked: while an external monitor is connected it becomes
# the sole display at native resolution and the internal panel turns off; when
# none is present eDP-1 stays on. That live switching is done by the hotplug
# handler scripts/external-monitor-primary.sh (started from autostart.conf) —
# the rules below are just the safe defaults it builds on. Match the external
# by description so it sticks regardless of which port it negotiates. Run
# `hyprctl monitors` to read a monitor's description if you swap in another one.

# Internal laptop panel — always defined so booting undocked gives a screen.
monitor = eDP-1, preferred, 0x0, 1

# External (Samsung Odyssey G5) — native/preferred mode; the handler disables
# eDP-1 and repositions this to 0,0 whenever it is connected.
monitor = desc:Samsung Electric Company Odyssey G5 HNAY800546, preferred, 0x0, 1
